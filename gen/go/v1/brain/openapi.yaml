openapi: 3.1.0
info:
  title: ""
  version: ""
paths:
  /health:
    get:
      operationId: health
      parameters:
        - name: uuid
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Conscious.Health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/brainRunner/run:
    post:
      operationId: in
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
        required: true
      responses:
        "200":
          description: Conscious.In response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        uuid:
          type: string
        status:
          $ref: '#/components/schemas/HealthResponse.HealthStatus'
        statusMessage:
          type: string
        errorMessage:
          type: string
    HealthResponse.HealthStatus:
      type: string
      enum:
        - HealthIgnore
        - Active
        - Waiting
        - Down
    Request:
      type: object
      properties:
        uuid:
          description: UUID for tracking each request
          type: string
        name:
          type: string
        description:
          type: string
        prompt:
          type: string
        bodyText:
          type: string
        bodyBytes:
          type: string
          format: base64
        vision:
          type: string
          format: base64
        audio:
          type: string
          format: base64
        text:
          type: string
          format: base64
        data:
          type: string
    Response:
      type: object
      properties:
        uuid:
          description: UUID for tracking each request
          type: string
        name:
          type: string
        description:
          type: string
        response:
          type: string
        prompt:
          type: string
        bodyText:
          type: string
        bodyBytes:
          type: string
          format: base64
        vision:
          type: string
          format: base64
        audio:
          type: string
          format: base64
        text:
          type: string
          format: base64
        data:
          type: string
