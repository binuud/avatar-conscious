syntax = "proto3";
package quatumUI;

option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/quantumUI";


message uiComponent {
  string id = 1;
  string class = 2;
  string label = 3;
  enum UiType {
    UiTypeIgnore = 0;
    TEXTAREA = 1;
    INPUT = 2;
    CHECKBOX = 3;
    PLAINTEXT = 4;
    BUTTON = 5;
    WEBCAM = 6;
  }
  string value = 4;
  string placeHolder = 5;
  string help = 6;
  string style = 7;
  int32 width = 8;
  int32 rows = 9;
  int32 cols = 10;
  UiType type = 11; 
}

message quantumUI {
  string uuid = 1;
  string name = 2;
  string description =  3;
  string title = 4;
  repeated uiComponent components = 5;
}

message Config {
  enum Type {
    DATA_IGNORE = 0;
    STRING = 1;
    NUMBER = 2;
    FLOAT = 3;
    BOOLEAN = 4;
  }
  string name = 1;
  string description = 2;
  string value = 3;
  string group = 4;
  Type type = 5;
}

message ConfigList {
  repeated Config configs = 1;
}

message Settings {
  map<string, Config> entry = 1;
}
