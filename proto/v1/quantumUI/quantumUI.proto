syntax = "proto3";
package quatumUI;

option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/quantumUI";


message UiComponent {
  string id = 1;
  string class = 2;
  string label = 3;
  enum UiType {
    UiTypeIgnore = 0;
    TEXTAREA = 1;
    INPUT = 2;
    CHECKBOX = 3;
    PLAINTEXT = 4;
    BUTTON = 5;
    WEBCAM = 6;
  }
  string value = 4;
  string placeHolder = 5;
  string help = 6;
  string style = 7;
  int32 width = 8;
  int32 rows = 9;
  int32 cols = 10;
  UiType type = 11; 
}

message QuantumUI {
  string uuid = 1;
  string name = 2;
  string description =  3;
  string title = 4;
  repeated UiComponent components = 5;
}
