syntax = "proto3";
package avatar;

option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/avatar";

import "v1/avatar/avatar.proto";
import "v1/avatar/avatarControl.proto";

// for http annotations
import "google/api/annotations.proto";


service AvatarService {

  rpc Get(GetRequest) returns (GetResponse) {
    option (google.api.http) = {
      get : "/v1/avatar/get"
    };
  }

  rpc Build(BuildRequest) returns (BuildResponse) {
    option (google.api.http) = {
      get : "/v1/avatar/build"
    };
  }

  // Start the avatar, avatar is a long running process
  // for non interactive sessions
  rpc Start(StartRequest) returns (StartResponse) {
    option (google.api.http) = {
      post : "/v1/avatar/start"
    };
  }

  // Start the avatar using a bidirectional stream
  // for interactive sessions
  rpc Control(stream ControlRequest) returns (stream ControlResponse) {
    option (google.api.http) = {
      post : "/v1/avatarlive/connect"
    };
  }

  rpc Stop(StopRequest) returns (StopResponse) {
    option (google.api.http) = {
      post : "/v1/avatar/stop"
    };
  }
}

message GetRequest {
  string uuid = 1;
  string name = 2;
}

message GetResponse {
  Avatar avatar = 1;
}

message BuildRequest {
  string uuid = 1;
  string name = 2;
}

message BuildResponse {
  Avatar avatar = 1;
}

message StartRequest {
  string uuid = 1;
  string name = 2;
}

message StartResponse {
  Avatar avatar = 1;
}

message ControlRequest {
  AvatarControl control = 1;
}

message ControlResponse {
  AvatarControl control = 1;
}

message StopRequest {
  string uuid = 1;
  string name = 2;
}

message StopResponse {
  Avatar avatar = 1;
}