syntax = "proto3";
package avatar;

option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/avatar";

import "v1/quantumUI/quantumUI.proto";
// import "v1/avatar/avatarControl.proto";
// Permission enum for the Avatar message

message ToolParams {
  string name = 1;
  string type = 2;
  string description = 3;
  bool required = 4;
}

message Tool {
  string name = 1;
  string description = 2;
  string type = 3;
  map<string, ToolParams> parameters = 4;
}

enum Permission {
  PERMISSION_IGNORE = 0;
  WEBCAMERA = 1;
  ROBOT = 2;
  ROVER = 3;
  ARM = 4;
  HOMEAUTOMATION = 5;
}

enum AvatarActionType {
  AvatarActionTypeIgnore = 0;
  CommandLine = 1;
  WebSearch = 2;
  WebApi = 3;
  Robotic = 4;
  IO = 5;
  AiQuery = 6;
  AiImageDescribe = 7;
  AiImageGeneration = 8;
}


// from the front matter
message AvatarMeta {
  // Unique identifier for the avatar
  string uuid = 1;
  
  // Name of the avatar
  string name = 2;
  
  // Description of the avatar
  string description = 3;

  string image = 4;

  repeated string triggers = 5;

  // white list of allowed ai_tools
  repeated string ai_allowed_tools = 6;

}


// for parsing data from yaml or json,
// we need to have a proper proto message of the format
// which will be saved or read from
message UiCollection {
  repeated quatumUI.QuantumUI ui = 1;
}

message Step {
  string name = 1;
  string description = 2;
  string prompt = 3;
  enum StepType {
    STEP_TYPE_ENUM_DEFAULT = 0;
    STEP_TYPE_ENUM_AI = 1;
    STEP_TYPE_ENUM_UI = 2;
  }
  // not using as enum, because of issues with parsing by AI
  StepType step_type = 4;
}

// this is required as a seperate message
// do not remove
// this is for ai to parse steps into a known structure
message Steps {
  repeated Step steps = 1;
}

// Avatar message representing a robot or avatar entity
message Avatar {

  AvatarMeta meta = 1;
  
  // Permissions granted to the avatar
  Permission permissions = 4;
  
  // System prompt for the avatar
  string systemPrompt = 5;

  repeated Step steps = 6;

  // multiple ui elements and forms can be associated with each avatr
  UiCollection uiCollection = 7;
  
  // the complete data of the Avatar file
  string content = 10;

}
