syntax = "proto3";
package avatar;

option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/avatar";

import "v1/conscious/common.proto";
import "v1/conscious/contextMessage.proto";
import "v1/quantumUI/quantumUI.proto";

// Permission enum for the Avatar message

message ToolParams {
  string name = 1;
  string type = 2;
  string description = 3;
  bool required = 4;
}

message Tool {
  string name = 1;
  string description = 2;
  string type = 3;
  map<string, ToolParams> parameters = 4;
}

enum Permission {
  PERMISSION_IGNORE = 0;
  WEBCAMERA = 1;
  ROBOT = 2;
  ROVER = 3;
  ARM = 4;
  HOMEAUTOMATION = 5;
}

enum AvatarActionType {
  AvatarActionTypeIgnore = 0;
  CommandLine = 1;
  WebSearch = 2;
  WebApi = 3;
  Robotic = 4;
  IO = 5;
  AiQuery = 6;
  AiImageDescribe = 7;
  AiImageGeneration = 8;
}


// from the front matter
message AvatarMeta {
  // Unique identifier for the avatar
  string uuid = 1;
  
  // Name of the avatar
  string name = 2;
  
  // Description of the avatar
  string description = 3;

  string image = 4;

  repeated string triggers = 5;

  quatumUI.QuantumUI ui = 6;
}


message Step {
  string name = 1;
  string description = 2;
  string prompt = 3;
}

// this is required as a seperate message
// do not remove
// this is for ai to parse steps into a known structure
message Steps {
  repeated Step steps = 1;
}

enum AvatarStatus {
  AvatarActionStatusIgnore = 0;
  // initialized and ready to accept commands
  STATUS_INIT = 1;
  STATUS_SUCCESS = 2;
  STATUS_ACTIVE = 3;
  // waiting for user input
  // or some io

  STATUS_RERUN = 4;
  STATUS_ERROR = 5;
  STATUS_FAILED = 6;
  STATUS_FATAL = 7;
  STATUS_STOPPED = 8;
  STATUS_NOT_STARTED = 9;
  // Avatar is waiting for some input or IO
  // or an event
  STATUS_WAITING = 10;
  STATUS_UI_WAITING = 11;
  STATUS_IO_WAITING = 12;
}

// Step status is kept seperate from Steps
// LLM will generate the Steps
// StepStatus is updated by Avatar Handler
message StepStatus {
  AvatarStatus status = 1;
  Timestamp created_at = 2;
  Timestamp completed_at = 3;

  enum ResponseType {
    RESPONSE_TYPE_IGNORE = 0;
    IMAGEDATA = 1;
    TEXT = 2;
  }
  ResponseType response_type = 5; 
  string reqeust = 6;
  string response = 7;
}

// Avatar message representing a robot or avatar entity
message Avatar {

  AvatarMeta meta = 1;
  
  // Permissions granted to the avatar
  Permission permissions = 4;
  
  // System prompt for the avatar
  string systemPrompt = 5;

  repeated Step steps = 6;

  // the complete data of the Avatar file
  string content = 10;

}

// for control the avatar
// bidirectional stream control can be used
message AvatarControl {
  enum AvatarAction {
    AVATAR_ACTION_IGNORE = 0;
    // initialize the avatar
    // making it ready to accept control actions like run, start debug etc
    INIT = 1;
    // Run the avatar to completion
    RUN = 2;
    // Start the avatar in step by step mode
    START_DEBUG = 3;
    STOP = 4;
    // Run a particular step
    RUN_STEP = 5;
    STOP_STEP = 6;
    SEND_DATA = 7;
  }

  AvatarMeta meta = 1;
  AvatarStatus status = 2;
  AvatarAction action = 3;
  int32 current_step = 4;
  repeated StepStatus stepStatuses = 5;
  string response = 6;
  Timestamp created_at = 11;
  Timestamp completed_at = 12;
}