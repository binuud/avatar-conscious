syntax = "proto3";
package settings;

option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/settings";


message Config {
  enum Type {
    DATA_IGNORE = 0;
    STRING = 1;
    MULTI_LINE_STRING = 2;
    NUMBER = 3;
    FLOAT = 4;
    BOOLEAN = 5;
    MULTI_OPTION = 6;
  }
  string name = 1;
  string description = 2;
  string group = 3;
  string value = 4;
  // the default value given by developers
  string default = 5;
  // env value set from environment, always overrides config value
  string envValue = 6;
  repeated string options = 7;
  int64 weight = 8;
  Type type = 9;
  int64 numLines = 10;
  int64 min = 11;
  int64 max = 12;
}

message ConfigList {
  repeated Config configs = 1;
}

message Configs {
  string name = 1;
  map<string, Config> entry = 2;
}
