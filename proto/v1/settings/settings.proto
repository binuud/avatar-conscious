syntax = "proto3";
package settings;

option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/settings";


message Config {
  enum Type {
    DATA_IGNORE = 0;
    STRING = 1;
    NUMBER = 2;
    FLOAT = 3;
    BOOLEAN = 4;
  }
  string name = 1;
  string description = 2;
  string value = 3;
  string group = 4;
  Type type = 5;
}

message ConfigList {
  repeated Config configs = 1;
}

message Settings {
  map<string, Config> entry = 1;
}
