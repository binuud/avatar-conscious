syntax = "proto3";
package settings;

option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/settings";


message Config {
  enum Type {
    DATA_IGNORE = 0;
    STRING = 1;
    NUMBER = 2;
    FLOAT = 3;
    BOOLEAN = 4;
  }
  string name = 1;
  string description = 2;
  string group = 3;
  string value = 4;
  // the default value given by developers
  string default = 5;
  // env value set from environment, always overrides config value
  string envValue = 6;
  Type type = 7;
}

message ConfigList {
  repeated Config configs = 1;
}

message Configs {
  string name = 1;
  map<string, Config> entry = 2;
}
