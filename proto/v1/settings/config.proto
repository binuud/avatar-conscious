syntax = "proto3";
package settings;

option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/settings";

message ImageGeneration {
  string  model = 1;
  string  systemPrompt = 2;
  int32   width = 3;
  int32   height = 4;
}

message ChatGeneration {
  string  model = 1;
  string  systemPrompt = 2;
  int64   maxToken = 3;
}


message Settings {
  string            uuid = 1;
  string            fileName = 2;
  ChatGeneration    chatSettings = 11;
  ImageGeneration   imageSettings = 12;
}
