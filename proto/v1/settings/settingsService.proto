/// Please use the following editor setup for this file:

// Tab size=4; Tabs as spaces; Clean up trailing whitepsace
// 'make proto' will run clang-format to fix formatiing
syntax = "proto3";
package settings;
option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/settings";

import "v1/settings/settings.proto";
// for http annotations
import "google/api/annotations.proto";


service Settings {

  // get a Settings by name or key
  rpc Get(SettingsGetRequest) returns (SettingsGetResponse) {
    option (google.api.http) = {
      get : "/v1/Settings/get"
    };
  }

  // get all non internal Settings
  rpc List(SettingsListRequest) returns (SettingsListResponse) {
    option (google.api.http) = {
      get : "/v1/Settings/list"
    };
  }

  // set a Settings by name or key
  rpc Set(SettingsSetRequest) returns (SettingsSetResponse) {
    option (google.api.http) = {
      post : "/v1/Settings/set"
      body : "*"
    };
  }

}

message SettingsGetRequest {
  string name = 1;
}

message SettingsGetResponse {
  Config entry = 1;
}

message SettingsListRequest {
  string name = 1;
}

// List Reponse, groups settings by group
// each group can have an array of config entries
// so settings can be group like LLM, UI, DATABASE etc
// this makes UI effort easier
message SettingsListResponse {
  
  map<string, ConfigList> groups = 1;
}

message SettingsSetRequest {
  string name = 1;
  Config entry = 2;
}

message SettingsSetResponse {
  Config entry = 1;
}