/// Please use the following editor setup for this file:

// Tab size=4; Tabs as spaces; Clean up trailing whitepsace
// 'make proto' will run clang-format to fix formatiing
syntax = "proto3";
package aiModule;
option go_package = "github.com/dronasys-com/brain-nodes/gen/go/v1/aiModule";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

// All Ai modules will use the same structure / message to communicate
// with each other

message ConfigEntry {
  enum ConfigEntryType {
    ConfigEntryIgnore = 0;
    String = 1;
    Integer = 2;
    Float = 3;
    Boolean = 4;
    MultiLineText = 5;
    Dropdown = 6;
    Image = 7;
  }

  string name = 1;
  // used for storing temporary form values
  // so we do not have to create a inherited class
  string value = 2;
  ConfigEntryType type = 3;
  string description = 4;
  // Example values
  string examples = 5;
  // defualt value for the variable
  string default = 11;
  // possible options for the variable which can be shown on a dropdown
  // when options is present, the final value should be on of the data
  // present in the options array
  repeated string options = 12;
  // Pattern for regexp validation
  string pattern = 13;
  // attachable var names, eg: phpmyadmin can attach to mysql, so the env
  // variable of mysql will be linked to env variable of phpmyadmin
  string attachables = 14;

  // These are ui elements
  // set the ordered of the element, since the config
  // will be exposes as a map<string,config>
  int64 order = 21;
  // If set, can be used to render on forms
  bool show = 22;
}

// each AiModule will only be configurable via the
// ModuleConfig message
message ModuleConfig { map<string, ConfigEntry> configMap = 1; }

//  Request and Response Objects of RPC

message GenerateRequest {
  string uuid = 1; // UUID for tracking each request

  string name = 3;
  string description = 4;

  // name of the ai model to use
  string model = 5;
  string prompt = 11;
  string systemPrompt = 12;
  string negativePrompt = 13;

  int64 seed = 14;
  float temperature = 15;
  // each element of the form as a corresponding Display Element
  // this is to save the state of form elements that have to be displayed on
  // google.protobuf.Any body = 13;
  string bodyText = 21;
  bytes bodyBytes = 22;
  bytes vision = 23;
  bytes audio = 24;
  bytes text = 25;
  string data = 26;
  map<string, string> header = 31;
  map<string, string> query = 32;
}

message GenerateResponse {
  string uuid = 1; // UUID for tracking each request

  string name = 3;
  string description = 4;
  string model = 5;
  string response = 6;
  string filename = 7;
  enum FileTypeEnum {
    FileTypeIgnore = 0;
    Audio = 1;
    Movie = 2;
    Image = 3;
    Text = 4;
  }
  FileTypeEnum fileType = 8;
  // each element of the form as a corresponding Display Element
  // this is to save the state of form elements that have to be displayed on
  // google.protobuf.Any body = 13;
  int64 seed = 14;
  float temperature = 15;
  int64 createdAt = 16;
  int64 processTime = 17;
  string bodyText = 21;
  bytes bodyBytes = 22;
  bytes vision = 23;
  bytes audio = 24;
  bytes text = 25;
  string data = 26;
  map<string, string> header = 31;
  map<string, string> query = 32;
}

message SetConfigRequest { ModuleConfig config = 1; }
message SetConfigResponse { ModuleConfig config = 1; }

message GetConfigRequest {}
message GetConfigResponse { ModuleConfig config = 1; }

// For tracking purpose a uuid is sent in the request
message HealthRequest { string uuid = 1; }

message HealthResponse {
  enum HealthStatus {
    HealthIgnore = 0;
    Active = 1;
    Waiting = 2;
    Down = 3;
  }
  google.protobuf.Timestamp createdAt = 1;
  string uuid = 2;
  HealthStatus status = 3;
  string statusMessage = 6;
  string errorMessage = 7;
}

service AiModuleService {
  // Generate Post Api will be the main api exposed by all AiModules
  // TTS, LLM generation and all ai services have to implement this interface
  rpc Generate(GenerateRequest) returns (GenerateResponse) {
    option (google.api.http) = {
      post : "/generate"
      body : "*"
    };
  }
  // For setting configuration of the AI Module
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse) {
    option (google.api.http) = {
      post : "/setConfig"
      body : "*"
    };
  }
  // Get the current configuration of the AI Module
  // Also returns the Config Meta Object
  // UI or client will use the Config Meta to build the config form
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {
    option (google.api.http) = {
      get : "/getConfig"
    };
  }
  // Get the current Health Status of the AI Module
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = {
      get : "/health"
    };
  }
}