/// Please use the following editor setup for this file:

// Tab size=4; Tabs as spaces; Clean up trailing whitepsace
// 'make proto' will run clang-format to fix formatiing
syntax = "proto3";
package conscious;
option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/conscious";

import "v1/conscious/common.proto";
import "v1/conscious/contextMessage.proto";
import "v1/conscious/memory.proto";

// for http annotations
import "google/api/annotations.proto";

service MemoryService {

  rpc List(ListMemoryRequest) returns (ListMemoryResponse) {
    option (google.api.http) = {
      get : "/v1/memory/list"
    };
  }

  rpc GetMemoryMeta(GetMemoryMetaRequest) returns (GetMemoryMetaResponse) {
    option (google.api.http) = {
      get : "/v1/memory/getMemoryMeta"
    };
  }

  rpc Get(GetMemoryRequest) returns (GetMemoryResponse) {
    option (google.api.http) = {
      get : "/v1/memory/get"
    };
  }

  rpc Add(AddMemoryRequest) returns (AddMemoryResponse) {
    option (google.api.http) = {
      post : "/v1/memory/add"
      body : "*"
    };
  }

  rpc Update(UpdateMemoryRequest) returns (UpdateMemoryResponse) {
    option (google.api.http) = {
      post : "/v1/memory/update"
      body : "*"
    };
  }

  rpc Delete(DeleteMemoryRequest) returns (DeleteMemoryResponse) {
    option (google.api.http) = {
      post : "/v1/memory/delete"
      body : "*"
    };
  }

  // for keeping the memory meta
  // but deleting all interactions between user, assistant and agent
  rpc ClearMemory(ClearMemoryRequest) returns (ClearMemoryResponse) {
    option (google.api.http) = {
      post : "/v1/memory/clear"
      body : "*"
    };
  }

}