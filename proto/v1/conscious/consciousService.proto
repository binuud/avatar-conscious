/// Please use the following editor setup for this file:

// Tab size=4; Tabs as spaces; Clean up trailing whitepsace
// 'make proto' will run clang-format to fix formatiing
syntax = "proto3";
package conscious;
option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/conscious";

import "v1/conscious/common.proto";
import "v1/conscious/contextMessage.proto";

// for http annotations
import "google/api/annotations.proto";



// Conscious

service Conscious {

  rpc In(ContextMesssage) returns (ContextMesssage) {
    option (google.api.http) = {
      post : "/v1/conscious/in"
      body : "*"
    };
  }

  // Generate call internall routes the call to image generation
  // image description or tts, depending on the prompt
  rpc Generate(ContextMesssage) returns (stream ContextMesssage) {
    option (google.api.http) = {
      post : "/v1/conscious/generate"
      body : "*"
    };
  }

  rpc InStream(ContextMesssage) returns (stream ContextMesssage) {
    option (google.api.http) = {
      post : "/v1/conscious/inStream"
      body : "*"
    };
  }

  rpc GetModels(ModelRequest) returns (ModelResponse) {
    option (google.api.http) = {
      get : "/v1/conscious/models"
    };
  }

  rpc FileUpload(UploadRequest) returns (UploadResponse) {
    option (google.api.http) = {
      post : "/v1/conscious/fileUpload"
      body : "*"
    };
  }

  // Clears the memory
  rpc ClearMemory(ClearMemoryRequest) returns (ClearMemoryResponse) {
    option (google.api.http) = {
      post : "/v1/conscious/clearMeroy"
      body : "*"
    };
  }

  // Get the current Health Status of the AI Module
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = {
      get : "/v1/health"
    };
  }
}
