/// Please use the following editor setup for this file:

// Tab size=4; Tabs as spaces; Clean up trailing whitepsace
// 'make proto' will run clang-format to fix formatiing
syntax = "proto3";
package conscious;
option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/conscious";

import "v1/common/common.proto";
import "v1/conscious/contextMessage.proto";


message SingleContext {
  ContextMesssage in = 1;
  ContextMesssage out = 2;
}

message MemoryMeta {

  string uuid = 1;
  string name = 2;
  string description = 3;
  string model = 4;

  string systemPrompt = 6;
  int64  seed = 7;
  double  temperature = 8;
  common.Timestamp createdAt = 11;

}

message Memory {

  MemoryMeta meta = 1;
  repeated SingleContext contexts = 2;

}

message ListMemoryRequest {
  string name = 1;
}

message ListMemoryResponse {
  repeated MemoryMeta memories = 1;
}


message GetMemoryMetaRequest {
  string uuid = 1;
  string name = 2;
}

message GetMemoryMetaResponse {
  MemoryMeta meta = 1;
}

message GetMemoryRequest {
  string uuid = 1;
  string name = 2;
}

message GetMemoryResponse {
  Memory memory = 1;
}

message AddMemoryRequest {
  MemoryMeta meta = 1;
}

message AddMemoryResponse {
  MemoryMeta meta = 1;
}

message UpdateMemoryRequest {
  MemoryMeta meta = 1;
}

message UpdateMemoryResponse {
  MemoryMeta meta = 1;
}

message DeleteMemoryRequest {
  string uuid = 1;
  string name = 2;
}

message DeleteMemoryResponse {
  bool success = 1;
}

message ClearMemoryRequest {
  string uuid = 1;
  string name = 2;
}

message ClearMemoryResponse {
  bool success = 1;
}