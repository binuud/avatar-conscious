// Please use the following editor setup for this file:

// Tab size=4; Tabs as spaces; Clean up trailing whitepsace
// 'make proto' will run clang-format to fix formatiing
syntax = "proto3";
package conscious;
option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/conscious";

import "google/api/annotations.proto";

// SystemMetrics tracks the resource usage of a node
message SystemMetrics {

  // UUID of the node reporting the metrics
  string uuid = 1;

  // cpu usage as a percentage (0-100)
  double cpuUsage = 2;

  // total installed ram in bytes
  uint64 totalRamBytes = 3;

  // used ram in bytes
  uint64 usedRamBytes = 4;

  // ram usage as a percentage (0-100)
  double ramUsage = 5;

  // gpu usage as a percentage (0-100)
  double gpuUsage = 6;

  // memory used by GPU
  int64 gpuMemUsed = 7;

  // total disk in bytes
  uint64 totalDiskBytes = 8;

  // used disk in bytes
  uint64 usedDiskBytes = 9;

  // unix timestamp of when the metrics were sampled
  int64 createdAt = 11;
}

service Metrics {
    rpc GetSystemMetrics(GetSystemMetricsRequest) returns (stream SystemMetrics) {
    option (google.api.http) = {
      post : "/v1/consciousMetrics/getSystemMetrics"
      body : "*"
    };
  }
}


message GetSystemMetricsRequest {
  // Optional sampling interval in seconds for Watch (0 = server default).
  uint32 intervalSeconds = 1;
}