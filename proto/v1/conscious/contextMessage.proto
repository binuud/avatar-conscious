/// Please use the following editor setup for this file:

// Tab size=4; Tabs as spaces; Clean up trailing whitepsace
// 'make proto' will run clang-format to fix formatiing
syntax = "proto3";
option go_package = "github.com/binuud/conscious/gen/go/v1/conscious";

import "v1/conscious/common.proto";

message contextMesssage {

  // UUID for tracking each request
  string uuid = 1;

  string name = 2;
  string description = 3;

  // name of the ai model to use
  string model = 4;

  // context types, the same contextMessage is used for both request, response
  // this is for chaining
  enum ContextType {
    COTEXT_TYPE_IGNORE = 0;

    // this is sent to LLM model for inference
    LLM_QUERY = 1;

    // the message is sent to LLM model but expects stream as response
    LLM_STREAM_QUERY = 2;

    // for image generation
    IMAGE_GENERATION = 3;

    // text to speech
    TTS = 4;
  }

  ContextType type = 6;

  // role of the entity generating the message
  enum ContextRole {
    ROLE_IGNORE = 0;

    // when generated by live user
    USER = 1;

    // when generated by llm or other ai models
    ASSISTANT = 2;

    // when generated by system
    SYSTEM = 3;

    // when generated by ai agents
    AGENT = 4;
  }
  ContextRole role = 7;

  // if streaming response is required
  bool stream = 8;

  // user prompt
  string prompt = 11;
  // system prompt
  string systemPrompt = 12;

  // each element of the form as a corresponding Display Element
  // this is to save the state of form elements that have to be displayed on
  string data = 21;
  string bodyText = 22;
  bytes bodyBytes = 23;
  bytes vision = 24;
  bytes audio = 25;
  bytes text = 26;

  enum ContextStatus {
    STATUS_IGNORE = 0;
    SUCCESS = 1;
    FAIL = 2;
    
    // needs live user intervention
    FATAL = 3;
  }
  ContextStatus status = 31;

  string statusMessage = 32;
  string errorMessage = 33;

  string response = 41;
  string responseImage = 42;
  string reasoning = 43;
  string thinking = 44;
  Timestamp createdAt = 45;
  
}