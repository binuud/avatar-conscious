/// Please use the following editor setup for this file:

// Tab size=4; Tabs as spaces; Clean up trailing whitepsace
// 'make proto' will run clang-format to fix formatiing
syntax = "proto3";
option go_package = "github.com/binuud/avatar-conscious/gen/go/v1/conscious";

message Timestamp {

  // Seconds of UTC time since Unix epoch 1970-01-01T00:00:00Z.
  int64 seconds = 1; 
  // Non-negative fractions of a second at nanosecond resolution.
  int32 nanos = 2; 

}

// ai model
message Model {
  string uuid  = 1;
  string id = 2;
  int64 created = 3; 
  string owned_by = 4;
}

message HealthRequest { string uuid = 1; }

message HealthResponse {

  string uuid = 1;

  enum HealthStatus {
    HealthIgnore = 0;
    Active = 1;
    Waiting = 2;
    Down = 3;
  }

  HealthStatus status = 2;
  string statusMessage = 3;
  string errorMessage = 4;
  int64 createdAt = 5;

}

message ModelRequest{}

message ModelResponse {
  repeated Model models = 1;
}

message ClearMemoryRequest{}

message ClearMemoryResponse{}