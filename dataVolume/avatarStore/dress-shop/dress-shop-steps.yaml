steps:
- name: Step 1
  description: Launch an Avatar UI interface with interface id "web-camera"
  prompt: /launch-ui web-camera
- name: Step 2
  description: Launch an Avatar UI interface with id "select-dress"
  prompt: /launch-ui select-dress
- name: Step 3
  description: Generate an image yourself, wearing the selected dress of your choice  
  prompt: > 
    Edit the given image, using the image of the person from webcamera as reference, the image filename is given in the context. 
    Do not modify the face of the person.
    Keep the facial features, skin tone of the person exactly as they are in the original image.
    Create a new photo with the person wearing this clothes as given in Step 2, "select-dress" object entry